name: Lint de Markdown

# Checa a formatação dos arquivos .md do repositório (README, docs/,
# skills). É só checagem: se achar problema, a PR falha e quem escreveu o
# arquivo corrige e sobe de novo — nenhum commit automático é feito.

on:
  pull_request:
    paths:
      - "**/*.md"

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rodar markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !third_party/**
